name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ./Territory-Run

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Territory-Run/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          cmdline-tools-version: latest

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('Territory-Run/**/*.gradle*', 'Territory-Run/**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web assets
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Release Keystore
        if: ${{ secrets.RELEASE_STORE_FILE_BASE64 != '' }}
        run: |
          echo "${{ secrets.RELEASE_STORE_FILE_BASE64 }}" | base64 -d > ./android/app/release.keystore
          echo "RELEASE_STORE_FILE=release.keystore" >> $GITHUB_ENV
          echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ env.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ env.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ env.RELEASE_KEY_PASSWORD }}

      - name: Find APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          ls -la $APK_PATH

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Territory Run ${{ github.ref_name }}
          body: |
            ## Territory Run ${{ github.ref_name }}
            
            ### Installation
            1. Download `app-release.apk` below
            2. On your Android device, enable **Settings > Security > Install unknown apps** for your browser/file manager
            3. Open the downloaded APK and tap **Install**
            
            ### Features
            - GPS territory claiming with real-time multiplayer
            - Offline support with auto-sync
            - Push notifications for territory contests
            - Achievements, streaks, leaderboards
            - Dark/light mode, custom territory colors
            - Haptic feedback
            - Data export & account deletion (GDPR compliant)
            
            ### Permissions Required
            - `ACCESS_FINE_LOCATION` - GPS tracking for runs
            - `ACCESS_BACKGROUND_LOCATION` - Background tracking (optional)
            - `POST_NOTIFICATIONS` - Territory alerts
            - `FOREGROUND_SERVICE` - Keep GPS active during runs
            - `VIBRATE` - Haptic feedback
            - `WAKE_LOCK` - Keep screen on during runs
            - `INTERNET` - Firebase sync & map tiles
            
            ### Security
            - All data encrypted in transit (TLS 1.2+) and at rest (Firebase AES-256)
            - Firebase Auth with secure token rotation
            - No third-party tracking or advertising
            - Privacy Policy: https://territoryrun.app/privacy-policy.html
            - Terms of Service: https://territoryrun.app/terms-of-service.html
          files: |
            ${{ env.APK_PATH }}
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK as Artifact (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: territory-run-apk
          path: Territory-Run/android/app/build/outputs/apk/release/*.apk
          retention-days: 30