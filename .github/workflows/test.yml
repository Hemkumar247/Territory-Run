name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js 22.x
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: 'npm'
      - name: Install Dependencies
        run: npm ci
      - name: Code Quality & Linting
        run: npm run lint
      - name: Automated Testing (Vitest)
        run: npm run test
      - name: Build
        run: npm run build
