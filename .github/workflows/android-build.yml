name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0-beta.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.version || github.ref_name }}
      HAS_KEYSTORE: ${{ secrets.RELEASE_STORE_FILE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Release Keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RELEASE_STORE_FILE_BASE64 }}" | base64 -d > android/app/release.keystore
          {
            echo "RELEASE_STORE_FILE=release.keystore"
            echo "RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}"
            echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}"
            echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ env.TAG }}

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/TerritoryRun-${TAG}.apk"
          ls -la out

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Territory Run ${{ env.TAG }}
          body: |
            ## Territory Run ${{ env.TAG }}

            ### Installation
            1. Download `TerritoryRun-${{ env.TAG }}.apk` below on your Android phone
            2. When prompted, allow **Install unknown apps** for your browser/file manager
            3. Open the downloaded APK and tap **Install**

            Requires Android 7.0 (API 24) or newer.
          files: out/*.apk
          prerelease: ${{ contains(env.TAG, '-') }}

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: territory-run-apk
          path: out/*.apk
          retention-days: 30
