<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1422"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="polyStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#00FF88"/>
      <stop offset="100%" stop-color="#7B2FFF"/>
    </linearGradient>
    <linearGradient id="polyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle tactical grid -->
  <g stroke="#00E5FF" stroke-opacity="0.08" stroke-width="2">
    <line x1="128" y1="40" x2="128" y2="472"/>
    <line x1="256" y1="40" x2="256" y2="472"/>
    <line x1="384" y1="40" x2="384" y2="472"/>
    <line x1="40" y1="128" x2="472" y2="128"/>
    <line x1="40" y1="256" x2="472" y2="256"/>
    <line x1="40" y1="384" x2="472" y2="384"/>
  </g>

  <!-- Claimed territory polygon -->
  <polygon
    points="256,96 404,196 364,376 168,396 108,224"
    fill="url(#polyFill)"
    stroke="url(#polyStroke)"
    stroke-width="18"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Vertex nodes -->
  <circle cx="256" cy="96" r="14" fill="#00E5FF"/>
  <circle cx="404" cy="196" r="14" fill="#00FF88"/>
  <circle cx="364" cy="376" r="14" fill="#7B2FFF"/>
  <circle cx="168" cy="396" r="14" fill="#00FF88"/>
  <circle cx="108" cy="224" r="14" fill="#00E5FF"/>

  <!-- Center runner radar pulse -->
  <circle cx="256" cy="256" r="64" fill="#00E5FF" fill-opacity="0.14"/>
  <circle cx="256" cy="256" r="36" fill="#00FF88" fill-opacity="0.28"/>
  <circle cx="256" cy="256" r="20" fill="#FFFFFF" stroke="#00E5FF" stroke-width="6"/>
</svg>
