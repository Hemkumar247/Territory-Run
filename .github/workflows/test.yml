name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Territory-Run
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: Territory-Run/package-lock.json
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps
      - name: Code Quality & Linting
        run: npm run lint
      - name: Automated Testing (Vitest)
        run: npm run test
      - name: Build
        run: npm run build